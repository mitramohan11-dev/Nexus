<title>NEXUS Signal</title>
<style>
:root{--c:#00e5ff;--bg:#05060d;--buy:#00ff9d;--sell:#ff3860;--wait:#ffc233;--grid:rgba(0,229,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(120% 80% at 50% 0,#0d1230 0,var(--bg) 60%);color:#e8f0ff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
  padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ---- background ---- */
.floor{position:fixed;left:-60%;right:-60%;bottom:0;height:55vh;z-index:-2;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;transform:perspective(420px) rotateX(68deg);transform-origin:bottom;
  animation:flow 2.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%)}
@keyframes flow{to{background-position:0 64px}}
.orbit{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none;opacity:.45;transition:background 1s}
.o1{width:300px;height:300px;top:-60px;left:-80px;background:var(--c);animation:drift 14s ease-in-out infinite alternate}
.o2{width:260px;height:260px;bottom:10%;right:-90px;background:#7a4dff;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,80px) scale(1.2)}}

.wrap{max-width:560px;margin:auto;perspective:1200px}

/* ---- header ---- */
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.logo{font-weight:800;letter-spacing:.28em;font-size:15px;
  background:linear-gradient(90deg,#fff,var(--c),#a68bff,#fff);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.live{font-size:11px;letter-spacing:.2em;color:var(--c);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

/* ---- glass ---- */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);border-radius:20px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.tilt{transition:transform .25s ease,box-shadow .25s;transform-style:preserve-3d;will-change:transform}
.tilt.on{transition:transform .05s;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 30px color-mix(in srgb,var(--c) 35%,transparent)}

.greet{margin:-6px 2px 16px;animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
.greet b{display:block;font-size:20px;letter-spacing:.02em}
.greet b i{font-style:normal;color:var(--c);text-shadow:0 0 16px var(--c)}
.greet span{font-size:13px;color:#8a93c0;letter-spacing:.04em}
/* ---- search ---- */
.search{position:relative;padding:2px;border-radius:18px;overflow:hidden;margin-bottom:10px}
.search::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 60%,var(--c),transparent 90%);animation:spin2 4s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.search .in{position:relative;display:flex;gap:8px;padding:8px;border-radius:16px;background:#0a0d1c}
input[type=text]{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:17px;padding:10px 8px;
  text-transform:uppercase;letter-spacing:.08em}
input::placeholder{color:#5d6690}
button{border:0;border-radius:12px;padding:0 18px;font-weight:700;letter-spacing:.1em;font-size:13px;color:#031018;
  background:linear-gradient(135deg,var(--c),#7a4dff);box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent);
  transition:transform .15s}
button:active{transform:scale(.93)}
.auto{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a93c0;margin:2px 4px 14px;letter-spacing:.05em}
.sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:20px;background:#1b2140;position:relative;transition:.3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8a93c0;transition:.3s}
.sw:checked{background:color-mix(in srgb,var(--c) 40%,#1b2140)}
.sw:checked::after{left:19px;background:var(--c);box-shadow:0 0 10px var(--c)}

.rk{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;margin-bottom:14px}
.rk label{display:block;font-size:10px;letter-spacing:.18em;color:#8a93c0}
.rk input{width:100%;margin-top:4px;background:#0a0d1c;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;font-size:16px;padding:8px 10px;outline:0}
/* ---- hero ---- */
.hero{padding:18px 16px 16px;text-align:center}
.meta{font-size:11px;letter-spacing:.18em;color:#8a93c0;display:flex;justify-content:center;align-items:center;gap:8px}
.price{font-size:34px;font-weight:800;margin:6px 0 0;text-shadow:0 0 24px color-mix(in srgb,var(--c) 70%,transparent)}
.scene{position:relative;height:230px;display:grid;place-items:center;perspective:700px}
.orb{position:absolute;width:176px;height:176px;transform-style:preserve-3d;animation:spin 12s linear infinite}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);
  box-shadow:0 0 16px var(--c),inset 0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.r1{transform:rotateX(90deg)}.r2{}.r3{transform:rotateY(90deg) scale(.9);opacity:.7}
.r4{transform:rotateX(90deg) scale(1.25);opacity:.35;border-style:dashed}
.core{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#fff 0,var(--c) 28%,color-mix(in srgb,var(--c) 40%,#000) 75%);
  box-shadow:0 0 40px var(--c),0 0 90px color-mix(in srgb,var(--c) 60%,transparent);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.09)}}
.core b{font-size:22px;letter-spacing:.06em;color:#021016;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.verdict{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--c);text-shadow:0 0 18px var(--c);margin-top:2px}
.meter{position:relative;height:8px;border-radius:8px;margin:18px 6px 6px;
  background:linear-gradient(90deg,var(--sell),var(--wait) 50%,var(--buy))}
.mk{position:absolute;top:-6px;width:4px;height:20px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff;
  transform:translateX(-50%);transition:left 1s cubic-bezier(.2,1.2,.3,1)}
.mlab{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:#8a93c0;margin:0 4px}

/* ---- tiles ---- */
.sec{font-size:11px;letter-spacing:.25em;color:#8a93c0;margin:20px 4px 8px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:12px 14px}
.tile small{display:block;font-size:10px;letter-spacing:.2em;color:#8a93c0}
.tile b{font-size:19px}
.tfs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:420px){.tfs{grid-template-columns:repeat(3,1fr)}}
.tf{padding:10px 6px;text-align:center;border-radius:16px;position:relative;overflow:hidden}
.tf::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--k);box-shadow:0 0 12px var(--k)}
.tf .n{font-size:12px;color:#8a93c0;letter-spacing:.12em}
.tf .s{font-weight:800;font-size:15px;margin:4px 0;color:var(--k);text-shadow:0 0 12px var(--k)}
.tf .r{font-size:11px;color:#8a93c0}
.bar{height:4px;border-radius:4px;background:#1b2140;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--k);box-shadow:0 0 8px var(--k)}
.lvl{margin-top:8px;font-size:11px;font-weight:700;line-height:1.6;text-align:center;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.lvl span{display:block;white-space:nowrap}
.lvl .sl{color:var(--sell);text-shadow:0 0 8px rgba(255,56,96,.5)}
.lvl .tp{color:var(--buy);text-shadow:0 0 8px rgba(0,255,157,.5)}
.lvl.none{color:#5d6690;font-weight:500}
.wait-msg{padding:16px;text-align:center;color:#b8c0e8;font-size:14px}
.note{margin:22px 6px 0;font-size:11px;color:#5d6690;text-align:center;line-height:1.5}

/* ---- scan / error ---- */
.scan{padding:28px 16px;text-align:center;position:relative;overflow:hidden}
.scan::after{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;
  background:linear-gradient(transparent,color-mix(in srgb,var(--c) 40%,transparent),transparent);animation:sweep 1.4s linear infinite}
@keyframes sweep{to{top:100%}}
.err{padding:18px;color:var(--sell);text-align:center;font-size:14px}

.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -6px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:0 6px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:6px;background:#2a3158;transition:.3s}
.dots i.on{width:20px;background:var(--c);box-shadow:0 0 10px var(--c)}
.cscene{position:relative;height:280px;display:grid;place-items:center;perspective:800px;overflow:hidden}
.cndl{position:relative;width:60px;transform-style:preserve-3d;animation:cspin 7s ease-in-out infinite alternate}
@keyframes cspin{from{transform:rotateX(-14deg) rotateY(-38deg)}to{transform:rotateX(-14deg) rotateY(38deg)}}
.wick{position:absolute;left:50%;width:5px;margin-left:-2.5px;background:var(--k);box-shadow:0 0 12px var(--k);animation:wk .8s .6s both}
@keyframes wk{from{transform:scaleY(0)}}
.body{position:relative;width:60px;height:100%;transform-style:preserve-3d;animation:grow 1s cubic-bezier(.2,1.3,.3,1) both}
.body.up{transform-origin:bottom}.body.dn{transform-origin:top}
@keyframes grow{from{transform:scaleY(.02)}}
.body i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.45);background:linear-gradient(160deg,color-mix(in srgb,var(--k) 85%,#fff),var(--k) 45%,color-mix(in srgb,var(--k) 55%,#000));box-shadow:inset 0 0 22px rgba(255,255,255,.28),0 0 22px color-mix(in srgb,var(--k) 55%,transparent)}
.body .fr{transform:translateZ(30px)}.body .bk{transform:rotateY(180deg) translateZ(30px)}
.body .lf{transform:rotateY(-90deg) translateZ(30px)}.body .rt{transform:rotateY(90deg) translateZ(30px)}
.body .tp3{inset:auto;top:-30px;left:0;width:60px;height:60px;transform:rotateX(90deg)}
.body .bt{inset:auto;bottom:-30px;left:0;width:60px;height:60px;transform:rotateX(90deg)}
.ln{position:absolute;left:0;right:0;border-top:2px dashed;animation:lnin .9s .7s both;transform-origin:left}

.g1{fill:#00ff9d}.g2{fill:#00a868}.g3{fill:#9dffd6}.r1{fill:#ff3860}.r2{fill:#a81b3a}.r3{fill:#ff94a8}
.stage{perspective:900px;margin-top:8px;overflow:hidden}
.sway{transform-style:preserve-3d;animation:sway 8s ease-in-out infinite alternate}

.muted2{padding:46px 10px;color:#8a93c0;font-size:13px}
.cvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{cursor:pointer}.ctile.sel{box-shadow:0 0 24px #00e5ff,inset 0 0 0 1px #00e5ff}

.cvtop{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}

.coin b:nth-child(1){transform:translateZ(3px)}.coin b:nth-child(2){transform:rotateY(180deg) translateZ(3px)}

.cvin{display:flex;align-items:center;gap:8px;background:#0a0d1c;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 12px;margin:10px 0 8px}

.cvres{font-size:34px;font-weight:800;color:var(--c);text-shadow:0 0 24px var(--c);margin:10px 0 2px;overflow-wrap:anywhere}
.cvrate,.cvtrend{font-size:12px;color:#8a93c0;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 4px;text-align:left;font-size:13px;border-bottom:1px solid rgba(255,255,255,.08)}

.closed{padding:6px 0 4px;text-align:center}
.moon{width:84px;height:84px;margin:6px auto;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#cfd6ff;background:radial-gradient(circle at 30% 25%,#4a5390,#1a2040);box-shadow:0 0 40px rgba(138,147,192,.35),inset 0 0 18px rgba(255,255,255,.15);animation:float 4s ease-in-out infinite}

.cl-t{font-size:26px;font-weight:900;letter-spacing:.12em;color:#cfd6ff;text-shadow:0 0 18px #8a93c0}
.cl-s{font-size:12px;color:#8a93c0;margin-top:4px}
.cl-p{font-size:13px;color:#9aa3cf;margin:8px 10px 0}

.ddh i{font-style:normal;color:var(--c)}

.stc{padding:14px 16px;margin-top:12px}.stc b{color:var(--c);font-size:17px}
.stc ul{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.5;color:#cfd6ff}
.tz{float:right;color:#00e5ff;font-size:11px;letter-spacing:.03em;font-weight:500}
.storm{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bolt{position:absolute;inset:0}
.bolt polyline{fill:none;stroke:#e6efff;stroke-width:2.4;stroke-linejoin:round;filter:drop-shadow(0 0 6px #7aa8ff) drop-shadow(0 0 18px #5b8cff);animation:zap .95s linear both}

.flash{position:absolute;inset:0;background:radial-gradient(circle at var(--fx,50%) 0,rgba(170,195,255,.38),rgba(120,150,255,.1) 55%,transparent 80%);animation:zap .95s linear both}
@keyframes zap{0%{opacity:0}4%{opacity:1}10%{opacity:.15}16%{opacity:1}26%{opacity:.45}34%{opacity:.85}50%{opacity:.2}100%{opacity:0}}
.bql{margin-top:10px;font-size:12px;line-height:1.75;color:#cfd6ff}.bql b{color:var(--c);display:inline-block;min-width:26px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;touch-action:manipulation}
.floor{overflow:hidden;background:none!important;animation:none!important}
.floor::before{content:"";position:absolute;left:0;right:0;top:-64px;bottom:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;animation:flow2 2.4s linear infinite;will-change:transform}

.orbit,.orb,.cndl,.coin,.sway{will-change:transform;transform:translateZ(0)}
.glass{background:linear-gradient(115deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.05) 24%,transparent 42%),linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 42%),rgba(16,20,46,.84);border:1px solid rgba(255,255,255,.17);box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.36),inset 0 -1px 0 rgba(0,0,0,.4),inset 0 0 24px rgba(255,255,255,.03);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.tilt{transition:transform .45s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s}

button{transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s,filter .2s}

.reset,.swap,.ddh{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.04) 52%,rgba(0,0,0,.14)),rgba(38,46,96,.9);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,0,0,.4)}
.seg{background:rgba(8,11,28,.92);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.12)}

header{position:relative}

<script>
const TFS=["1m","3m","5m","1h","1d"], W={"1m":1,"3m":1,"5m":1.5,"1h":2,"1d":2.5};
const COL={BUY:"#00ff9d",SELL:"#ff3860",WAIT:"#ffc233"};
const $=id=>document.getElementById(id);

/* ---------- indicators ---------- */
function ema(v,n){const k=2/(n+1);let e=v[0];return v.map((x,i)=>i?(e=x*k+e*(1-k)):e)}
function rsi(c,n=14){
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];g+=Math.max(d,0);l+=Math.max(-d,0)}
  g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l);
}
function atr(r,n=14){
  const tr=[];for(let i=1;i<r.length;i++)tr.push(Math.max(r[i][0]-r[i][1],Math.abs(r[i][0]-r[i-1][2]),Math.abs(r[i][1]-r[i-1][2])));
  const t=tr.slice(-n);return t.reduce((a,b)=>a+b,0)/t.length;
}

/* ---------- data ---------- */
function normCrypto(s){
  s=s.toUpperCase().replace(".P","").replace(/[-\/ ]/g,"");
  if(/USD[TC]$/.test(s))return s;
  if(s.endsWith("USD"))return s+"T";
  return s+"USDT";
}
async function getJSON(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const HIST={},MEMO={};
function memo(k,ttl,fn){const m=MEMO[k];if(m&&Date.now()-m.t<ttl)return m.p;const p=fn();MEMO[k]={t:Date.now(),p};p.catch(()=>{delete MEMO[k]});return p}
const kl=x=>{const v=+x[5],hi=+x[2],lo=+x[3],c=+x[4],tb=x[9]!=null?+x[9]:(hi>lo?v*(c-lo)/(hi-lo):v*.5);return[hi,lo,c,+x[0],+x[1],v,tb]};   // high, low, close, time, open, volume, taker-buy volume
async function binPages(host,path,sym,tf,per,pages){
  let out=[],end="";
  for(let p=0;p<pages;p++){
    const k=await getJSON(`${host}${path}?symbol=${sym}&interval=${tf}&limit=${per}${end}`);
    if(!k.length)break;
    out=k.concat(out);end="&endTime="+(k[0][0]-1);
    if(k.length<per)break;
  }
  if(!out.length)throw new Error("no data");
  return out.map(kl);
}
async function bybitPages(sym,tf,pages,per){
  const bi={"1m":"1","3m":"3","5m":"5","1h":"60","1d":"D"}[tf];let out=[],end="";
  for(let p=0;p<pages;p++){
    const j=await getJSON(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=${bi}&limit=${per}${end}`);
    const l=j.result&&j.result.list;if(!l||!l.length)break;
    const asc=l.slice().reverse();out=asc.concat(out);end="&end="+(+asc[0][0]-1);
    if(l.length<per)break;
  }
  if(!out.length)throw new Error("no data");
  return out.map(kl);
}
async function cryptoK(sym,tf,pages,per){
  try{return await binPages("https://fapi.binance.com","/fapi/v1/klines",sym,tf,Math.min(per,1500),pages)}catch(e){}
  try{return await binPages("https://data-api.binance.vision","/api/v3/klines",sym,tf,Math.min(per,1000),pages)}catch(e){}

  document.querySelectorAll(".tilt.on").forEach(x=>{if(x!==t){x.classList.remove("on");x.style.transform=""}});

function obZones(res,ov,raw,f){
  const r=res["5m"]||res["1m"]||res["1h"];if(!r||!r.X||r.X.n<80)return"";
  const X=r.X,n=X.n,i=n-1,p=X.c[i],a=X.at[i]||p*.001,PV=pivotsOf(X),lo=Math.max(3,n-400),tol=.5*a;
  const hs=[],ls=[];
  for(let j=ub(PV.ph,i-4)-1;j>=0&&PV.ph[j]>=lo;j--)hs.push(X.h[PV.ph[j]]);
  for(let j=ub(PV.pl,i-4)-1;j>=0&&PV.pl[j]>=lo;j--)ls.push(X.l[PV.pl[j]]);
  const cnt=(arr,v)=>arr.filter(u=>Math.abs(u-v)<=tol).length;
  const up=(arr,min,from)=>{let b=null;for(const v of arr)if(v>from&&(b===null||v<b)&&cnt(arr,v)>=min)b=v;return b};
  const dn=(arr,min,from)=>{let b=null;for(const v of arr)if(v<from&&(b===null||v>b)&&cnt(arr,v)>=min)b=v;return b};
  const rs=up(hs,2,p+.1*a)??up(hs,1,p+.1*a),sp=dn(ls,2,p-.1*a)??dn(ls,1,p-.1*a);
  let obB=null,obS=null;
  for(let j=i-1;j>lo+6&&(!obB||!obS);j--){
    const body=X.c[j]-X.o[j],rg=X.h[j]-X.l[j]||1e-9;
    if(Math.abs(body)<=1.4*a||Math.abs(body)<=.6*rg)continue;
    for(let k=j-1;k>=Math.max(lo,j-6);k--){
      if(body>0&&X.c[k]<X.o[k]){
        if(!obB){let ok=X.h[k]<=p+.2*a;for(let q=j;q<=i&&ok;q++)if(X.c[q]<X.l[k])ok=false;if(ok)obB=[X.l[k],X.h[k]]}
        break;
      }
      if(body<0&&X.c[k]>X.o[k]){
        if(!obS){let ok=X.l[k]>=p-.2*a;for(let q=j;q<=i&&ok;q++)if(X.c[q]>X.h[k])ok=false;if(ok)obS=[X.l[k],X.h[k]]}
        break;
      }
    }
  }
  const bull=ov==="BUY"||(ov==="WAIT"&&p>X.e50[i]),ob=bull?(obB||obS):(obS||obB);
  const liq=bull?dn(ls,2,(sp??p)-.2*a):up(hs,2,(rs??p)+.2*a);
  const d1=res["1d"]&&res["1d"].X,chg=d1&&d1.n>1?(d1.c[d1.n-1]/d1.c[d1.n-2]-1)*100:null;
  const tag=ov==="BUY"?"Bullish":ov==="SELL"?"Bearish":"Choppy",col=ov==="BUY"?COL.BUY:ov==="SELL"?COL.SELL:COL.WAIT;
  const row=(c,l,v)=>`<div class="obrow"><i class="dot2" style="background:${c}"></i><span>${l}</span><b class="mono">${v}</b></div>`;
  return `<div class="sec mono">// ORDER BLOCK & LIQUIDITY</div><div class="glass obz">
    <div class="obh"><b>${raw.toUpperCase()}</b><span class="tagb" style="color:${col};border-color:${col}">${tag}</span><span class="px mono">${f(p)}</span></div>
    ${chg!==null?`<div class="mono" style="font-size:13px;font-weight:700;color:${chg>=0?COL.BUY:COL.SELL};text-align:right;margin-top:2px">${chg>=0?"+":""}${chg.toFixed(2)}% today</div>`:""}
    <div style="margin-top:10px">${row("#ef4444","Resistance",rs!=null?f(rs):"-")}${row("#7c9cff","Order Block",ob?f(ob[0])+" - "+f(ob[1]):"-")}${row("#22c55e","Support",sp!=null?f(sp):"-")}${row("#d4a72c","Liquidity "+(bull?"(below)":"(above)"),liq!=null?f(liq):"-")}</div>

function qaMix(t){const A=[255,77,141],B=[255,210,74],C=[61,255,192],[x,y,u]=t<.5?[A,B,t*2]:[B,C,(t-.5)*2];return`rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*u)).join(",")})`}
function qaGauge(total,ov,anim){

  for(let i=0;i<=N;i++){

function qaStats(total,agree,n,conf){

function qaSpark(r,tf){

function moonPhase(d){const jd=d/86400000+2440587.5;return((jd-2451550.1)/29.530588853%1+1)%1}
function sunParams(now){
  if(!SUN){const a=new Date(now);a.setHours(6,0,0,0);SUN={rise:a.getTime(),set:a.getTime()+12.5*36e5}}
  const{rise,set}=SUN,M=40*6e4,d=sm(rise-M,rise+M,now)*(1-sm(set-M,set+M,now)),g=clamp(Math.exp(-Math.pow((now-rise)/(36*6e4),2))+Math.exp(-Math.pow((now-set)/(36*6e4),2)));
